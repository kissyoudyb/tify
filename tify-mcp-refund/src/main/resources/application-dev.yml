spring:
  datasource:
    url: jdbc:h2:mem:tify_refund;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      continue-on-error: false

mybatis-plus:
  global-config:
    db-config:
      # H2 默认把表转大写，关闭此选项以匹配物理表名
      table-underline: false