apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tify-mysql
  namespace: tify
spec:
  serviceName: tify-mysql
  replicas: 1
  selector:
    matchLabels:
      app: tify-mysql
  template:
    metadata:
      labels:
        app: tify-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - "--character-set-server=utf8mb4"
            - "--collation-server=utf8mb4_unicode_ci"
            - "--default-authentication-plugin=mysql_native_password"
            - "--default-time-zone=+08:00"
          envFrom:
            - secretRef:
                name: tify-mysql-secret
          env:
            - name: TZ
              value: Asia/Shanghai
          ports:
            - containerPort: 3306
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tify-mysql-data
