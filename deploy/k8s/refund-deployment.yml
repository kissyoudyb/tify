apiVersion: apps/v1
kind: Deployment
metadata:
  name: tify-mcp-refund
  namespace: tify
  labels:
    app: tify-mcp-refund
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tify-mcp-refund
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tify-mcp-refund
    spec:
      containers:
        - name: mcp-refund
          image: registry.tjzs.com/phadagent/tify-mcp-refund:rename-tify-8ce2d40-20260817-2231
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9001

          # ── 环境变量：非敏感配置来自 ConfigMap ───────────────
          envFrom:
            - configMapRef:
                name: tify-mcp-refund-config

          # ── 环境变量：敏感配置来自 Secret ─────────────────────
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tify-mcp-refund-secret
                  key: DB_PASSWORD

          # ── 资源限制（退款 MCP Server，轻量）──────────────────
          resources:
            requests:
              cpu:    "100m"
              memory: "256Mi"
            limits:
              cpu:    "500m"
              memory: "512Mi"

          # ── 探针：REST /health（业务走 MCP /sse + /messages）─
          readinessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

      terminationGracePeriodSeconds: 30
