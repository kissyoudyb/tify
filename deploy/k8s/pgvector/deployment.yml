apiVersion: apps/v1
kind: Deployment
metadata:
  name: tify-pgvector
  namespace: tify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tify-pgvector
  template:
    metadata:
      labels:
        app: tify-pgvector
    spec:
      containers:
        - name: pgvector
          image: pgvector/pgvector:pg16
          args: ["-c", "timezone=Asia/Shanghai"]
          envFrom:
            - secretRef:
                name: tify-pgvector-secret
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: PGTZ
              value: Asia/Shanghai
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tify-pgvector-data
