apiVersion: v1
kind: ConfigMap
metadata:
  name: tify-backend-config
  namespace: tify
data:
  # ── MySQL ─────────────────────────────────────────────────────
  DB_HOST:     "tify-mysql"
  DB_PORT:     "3306"
  DB_NAME:     "tify"
  DB_USERNAME: "tify"

  # ── Redis ─────────────────────────────────────────────────────
  REDIS_HOST: "tify-redis"
  REDIS_PORT: "6379"

  # ── pgvector（PostgreSQL）─────────────────────────────────────
  PGVECTOR_HOST:     "tify-pgvector"
  PGVECTOR_PORT:     "5432"
  PGVECTOR_DB:       "tify"
  PGVECTOR_USERNAME: "tify"

  # ── 应用 ──────────────────────────────────────────────────────
  SERVER_PORT: "8080"
  TZ:          "Asia/Shanghai"
  JVM_OPTS:    "-Xms256m -Xmx512m -Duser.timezone=Asia/Shanghai"
