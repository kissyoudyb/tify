apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hify-redis
  namespace: hify
spec:
  serviceName: hify-redis
  replicas: 1
  selector:
    matchLabels:
      app: hify-redis
  template:
    metadata:
      labels:
        app: hify-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          command:
            - sh
            - -c
            - |
              # 用环境变量拼出带密码的 appendonly 配置
              cat > /usr/local/etc/redis/redis.conf <<EOF
              bind 0.0.0.0
              protected-mode no
              appendonly yes
              requirepass $${REDIS_PASSWORD}
              EOF
              redis-server /usr/local/etc/redis/redis.conf
          envFrom:
            - secretRef:
                name: hify-redis-secret
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hify-redis-data
