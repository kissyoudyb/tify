name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 内部模块 com.hify:* SNAPSHOT 只存在于本机私有 m2(Nexus 上 404),
# 云端/全新 runner 直接 mvn test 解析不到依赖,因此 unit/integration
# 都从仓库根目录用 reactor 构建(-pl xxx -am 自动把依赖模块纳入同一构建)。
jobs:
  unit:
    name: Unit tests (B1-B2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ./**/target
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Run hify-provider unit tests (B1-B2)
        run: mvn -B -pl hify-provider -am test -o 2>&1 || mvn -B -pl hify-provider -am test

  integration:
    name: Integration tests (B3-B6)
    needs: unit
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # runner 机器已按文档 §2.1 装好 JDK 17(Maven 3.9.9 + OpenJDK 17),
      # 不再由 setup-java 下载,避免自托管 runner 每次从 GitHub CDN 拉 JDK。
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ./**/target
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Verify K8s middleware is reachable
        run: |
          for p in 13306 16379 15432; do
            if (echo > /dev/tcp/127.0.0.1/$p) >/dev/null 2>&1; then
              echo "port $p OK"
            else
              echo "port $p CLOSED (需要 kubectl port-forward, namespace hify)"
              exit 1
            fi
          done

      - name: Run hify-app integration tests (B3-B6)
        run: mvn -B -pl hify-app -am test -o 2>&1 || mvn -B -pl hify-app -am test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            hify-app/target/surefire-reports/
            hify-provider/target/surefire-reports/
          if-no-files-found: warn
