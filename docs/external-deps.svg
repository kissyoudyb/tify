      <text x="14" y="56" fill="#9F123D">GPT-4o / GPT-4-turbo 等</text>
    </g>
    <g transform="translate(980, 758)">
      <rect width="240" height="68" rx="8" fill="white" stroke="#BE123C" stroke-width="1.2"/>
