      <path d="M6,20 v22 a14,5 0 0 0 28,0 v-22" fill="white" stroke="#047857" stroke-width="1.2"/>
      <ellipse cx="20" cy="42" rx="14" ry="5" fill="white" stroke="#047857" stroke-width="1.2"/>
      <text x="46" y="22" font-weight="700" fill="#064E3B">MySQL 8.x</text>
      <text x="46" y="40" fill="#065F46">业务数据持久化</text>
      <text x="46" y="56" fill="#065F46">HikariCP 5-20 连接</text>
    </g>
    <g transform="translate(360, 758)">
      <rect width="260" height="68" rx="8" fill="white" stroke="#047857" stroke-width="1.2"/>
      <rect x="6" y="14" width="248" height="40" rx="6" fill="white" stroke="#047857" stroke-width="1.2"/>
      <rect x="14" y="20" width="232" height="6" rx="2" fill="#6EE7B7"/>
      <rect x="14" y="42" width="232" height="6" rx="2" fill="#6EE7B7"/>
      <text x="130" y="36" text-anchor="middle" font-weight="700" fill="#064E3B">Redis 7.x</text>
      <text x="130" y="49" text-anchor="middle" font-size="10" fill="#065F46">配置缓存 30min · 会话 2h</text>
    </g>
    <g transform="translate(80, 850)">
      <rect width="260" height="68" rx="8" fill="white" stroke="#047857" stroke-width="1.2"/>
      <polygon points="130,8 16,58 244,58" fill="white" stroke="#047857" stroke-width="1.2"/>
      <polygon points="130,18 36,52 224,52" fill="#D1FAE5" stroke="#047857" stroke-width="0.8"/>
      <text x="130" y="42" text-anchor="middle" font-weight="700" fill="#064E3B">pgvector</text>
      <text x="130" y="64" text-anchor="middle" font-size="10" fill="#065F46">向量存储 + 相似度检索</text>
    </g>
    <g transform="translate(360, 850)">
      <rect width="260" height="68" rx="8" fill="white" stroke="#047857" stroke-width="1.2"/>
      <polygon points="130,10 230,40 130,58 30,40" fill="white" stroke="#047857" stroke-width="1.2"/>
      <text x="130" y="32" text-anchor="middle" font-weight="700" fill="#064E3B">Nginx</text>
      <text x="130" y="46" text-anchor="middle" font-size="10" fill="#065F46">静态托管 · API 反代</text>
      <text x="130" y="58" text-anchor="middle" font-size="10" fill="#065F46">proxy_buffering off</text>
    </g>
    <g transform="translate(80, 942)">
      <rect width="540" height="48" rx="8" fill="white" stroke="#047857" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="14" y="20" font-weight="700" fill="#064E3B">Docker + Kubernetes</text>
      <text x="14" y="36" fill="#065F46">全部组件镜像化 · Docker Compose 本地起 · K8s 50 人规模部署</text>
    </g>
  </g>

  <!-- Lines from middleware to app -->
  <g stroke="#047857" stroke-width="1.4" marker-end="url(#ah)">
    <line x1="210" y1="758" x2="540" y2="650"/>
    <line x1="490" y1="758" x2="600" y2="650"/>
    <line x1="210" y1="850" x2="540" y2="650"/>
    <line x1="490" y1="850" x2="640" y2="650"/>
    <line x1="350" y1="942" x2="640" y2="650"/>
  </g>

  <!-- ============ Right: External APIs (red) ============ -->
  <g filter="url(#sh)">
    <rect x="680" y="690" width="560" height="350" rx="14" fill="url(#grad-api)" stroke="#BE123C" stroke-width="1.5" opacity="0.4"/>
    <text x="700" y="718" font-size="14" font-weight="700" fill="#881337">☁️ 类别 3 · 外部 API（出网调用）</text>
    <text x="700" y="735" font-size="11" fill="#9F123D">tify-provider 适配 · tify-mcp 转发 · apiKey 由前端配置</text>
  </g>

  <g font-size="11">
    <g transform="translate(720, 758)">
      <rect width="240" height="68" rx="8" fill="white" stroke="#BE123C" stroke-width="1.2"/>
