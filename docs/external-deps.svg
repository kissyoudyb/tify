      <text x="14" y="40" fill="#9F123D">api.anthropic.com</text>
      <text x="14" y="56" fill="#9F123D">Claude 3.5 / Opus / Sonnet</text>
    </g>
    <g transform="translate(720, 840)">
      <rect width="240" height="68" rx="8" fill="white" stroke="#BE123C" stroke-width="1.2"/>
      <text x="14" y="22" font-weight="700" fill="#881337">Google Gemini</text>
      <text x="14" y="40" fill="#9F123D">generativelanguage.googleapis.com</text>
      <text x="14" y="56" fill="#9F123D">Gemini Pro / Flash</text>
    </g>
    <g transform="translate(980, 840)">
      <rect width="240" height="68" rx="8" fill="white" stroke="#BE123C" stroke-width="1.2"/>
      <text x="14" y="22" font-weight="700" fill="#881337">Ollama</text>
      <text x="14" y="40" fill="#9F123D">http://localhost:11434</text>
      <text x="14" y="56" fill="#9F123D">本地 Llama / Qwen 等</text>
    </g>
    <g transform="translate(720, 922)">
      <rect width="500" height="68" rx="8" fill="white" stroke="#BE123C" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="14" y="22" font-weight="700" fill="#881337">MCP Servers（外部工具集）</text>
      <text x="14" y="40" fill="#9F123D">JSON-RPC over HTTP/SSE · MCP Java SDK 1.1.1 序列化</text>
      <text x="14" y="56" fill="#9F123D">配置存于 tify-mcp，延迟调用外部工具</text>
    </g>
    <g transform="translate(720, 1004)">
      <rect width="500" height="22" rx="4" fill="white" stroke="#BE123C" stroke-width="1" opacity="0.7"/>
      <text x="14" y="16" font-size="10" fill="#9F123D" font-style="italic">所有 LLM 调用走 Resilience4j 熔断 + 60s 超时 + 异常分类重试</text>
    </g>
  </g>

  <!-- Lines from external API to app -->
