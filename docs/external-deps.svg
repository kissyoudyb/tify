  <!-- ============ Bottom: Middleware (green) ============ -->
  <g filter="url(#sh)">
    <rect x="40" y="690" width="600" height="350" rx="14" fill="url(#grad-mw)" stroke="#047857" stroke-width="1.5" opacity="0.4"/>
