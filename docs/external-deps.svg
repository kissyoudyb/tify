<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1100" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="grad-app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0E7FF"/><stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="grad-java" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/><stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="grad-mw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D1FAE5"/><stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="grad-api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE4E6"/><stop offset="100%" stop-color="#FDA4AF"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1280" height="1100" fill="url(#bg)"/>
  <text x="640" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Tify 外部依赖梳理</text>
  <text x="640" y="56" text-anchor="middle" font-size="12" fill="#64748B">源：pom.xml · application.yml · README · CLAUDE.md</text>

  <!-- ============ Center: Tify application ============ -->
  <g filter="url(#sh)">
    <rect x="490" y="430" width="300" height="220" rx="16" fill="url(#grad-app)" stroke="#4338CA" stroke-width="2"/>
    <text x="640" y="465" text-anchor="middle" font-size="18" font-weight="700" fill="#1E1B4B">Tify</text>
    <text x="640" y="485" text-anchor="middle" font-size="11" fill="#312E81">Spring Boot 3.2.3 · Java 17</text>

    <line x1="510" y1="498" x2="770" y2="498" stroke="#6366F1" stroke-width="0.8" opacity="0.4"/>

    <text x="640" y="520" text-anchor="middle" font-size="11" fill="#4338CA" font-weight="600">8 个内部模块</text>
    <text x="640" y="538" text-anchor="middle" font-size="11" fill="#64748B">app · chat · agent · workflow</text>
    <text x="640" y="555" text-anchor="middle" font-size="11" fill="#64748B">knowledge · provider · mcp · common</text>

    <line x1="510" y1="568" x2="770" y2="568" stroke="#6366F1" stroke-width="0.8" opacity="0.4"/>

    <text x="640" y="590" text-anchor="middle" font-size="11" fill="#4338CA" font-weight="600">接口边界</text>
    <text x="640" y="608" text-anchor="middle" font-size="11" fill="#64748B">REST /api/v1/* · SSE 流式</text>
    <text x="640" y="625" text-anchor="middle" font-size="11" fill="#64748B">MyBatis-Plus · Redis · pgvector</text>
    <text x="640" y="642" text-anchor="middle" font-size="11" fill="#64748B">Resilience4j · OkHttp</text>
  </g>

  <!-- ============ Top: Java dependencies (amber) ============ -->
  <g filter="url(#sh)">
    <rect x="40" y="90" width="1200" height="280" rx="14" fill="url(#grad-java)" stroke="#B45309" stroke-width="1.5" opacity="0.4"/>
    <text x="60" y="118" font-size="14" font-weight="700" fill="#78350F">📦 类别 1 · 关键 Java 依赖（pom.xml）</text>
    <text x="60" y="135" font-size="11" fill="#92400E">运行时由 Maven 引入到 classpath</text>
  </g>

  <!-- Java dep cards -->
  <g font-size="11">
    <g transform="translate(60, 152)">
      <rect width="220" height="62" rx="8" fill="white" stroke="#B45309" stroke-width="1"/>
      <text x="14" y="22" font-weight="700" fill="#78350F">Spring Boot 3.2.3</text>
      <text x="14" y="38" fill="#92400E">starter · web · validation</text>
      <text x="14" y="52" fill="#92400E">data-redis · aop · actuator · test</text>
    </g>
    <g transform="translate(294, 152)">
      <rect width="220" height="62" rx="8" fill="white" stroke="#B45309" stroke-width="1"/>
      <text x="14" y="22" font-weight="700" fill="#78350F">MyBatis-Plus 3.5.9</text>
      <text x="14" y="38" fill="#92400E">spring-boot3-starter</text>
      <text x="14" y="52" fill="#92400E">jsqlparser（分页插件）</text>
    </g>
    <g transform="translate(528, 152)">
      <rect width="220" height="62" rx="8" fill="white" stroke="#B45309" stroke-width="1"/>
      <text x="14" y="22" font-weight="700" fill="#78350F">Resilience4j 2.2.0</text>
      <text x="14" y="38" fill="#92400E">spring-boot3</text>
      <text x="14" y="52" fill="#92400E">熔断 + 重试（LLM per-provider）</text>
    </g>
    <g transform="translate(762, 152)">
      <rect width="220" height="62" rx="8" fill="white" stroke="#B45309" stroke-width="1"/>
      <text x="14" y="22" font-weight="700" fill="#78350F">OkHttp 4.12.0</text>
      <text x="14" y="38" fill="#92400E">同步 HTTP 客户端</text>
      <text x="14" y="52" fill="#92400E">LLM API / 工作流 API_CALL</text>
    </g>
    <g transform="translate(996, 152)">
      <rect width="220" height="62" rx="8" fill="white" stroke="#B45309" stroke-width="1"/>
      <text x="14" y="22" font-weight="700" fill="#78350F">OpenTelemetry API 1.38.0</text>
      <text x="14" y="38" fill="#92400E">traceId 生成</text>
      <text x="14" y="52" fill="#92400E">仅 API，SDK 后续接 Jaeger</text>
    </g>

    <g transform="translate(60, 230)">
      <rect width="220" height="62" rx="8" fill="white" stroke="#B45309" stroke-width="1"/>
      <text x="14" y="22" font-weight="700" fill="#78350F">Micrometer 1.12.3</text>
      <text x="14" y="38" fill="#92400E">micrometer-core（common）</text>
      <text x="14" y="52" fill="#92400E">prometheus registry（app）</text>
    </g>
    <g transform="translate(294, 230)">
      <rect width="220" height="62" rx="8" fill="white" stroke="#B45309" stroke-width="1"/>
      <text x="14" y="22" font-weight="700" fill="#78350F">Logstash Logback 7.4</text>
      <text x="14" y="38" fill="#92400E">JSON 结构化日志</text>
      <text x="14" y="52" fill="#92400E">ELK / Loki 接入</text>
    </g>
    <g transform="translate(528, 230)">
      <rect width="220" height="62" rx="8" fill="white" stroke="#B45309" stroke-width="1"/>
      <text x="14" y="22" font-weight="700" fill="#78350F">pgvector JDBC 0.1.4</text>
      <text x="14" y="38" fill="#92400E">向量类型映射</text>
      <text x="14" y="52" fill="#92400E">仅 tify-knowledge</text>
    </g>
    <g transform="translate(762, 230)">
      <rect width="220" height="62" rx="8" fill="white" stroke="#B45309" stroke-width="1"/>
      <text x="14" y="22" font-weight="700" fill="#78350F">MCP Java SDK 1.1.1</text>
      <text x="14" y="38" fill="#92400E">Model Context Protocol 官方</text>
      <text x="14" y="52" fill="#92400E">仅 tify-mcp</text>
    </g>
    <g transform="translate(996, 230)">
      <rect width="220" height="62" rx="8" fill="white" stroke="#B45309" stroke-width="1"/>
      <text x="14" y="22" font-weight="700" fill="#78350F">MySQL Connector/J 8.3.0</text>
      <text x="14" y="38" fill="#92400E">com.mysql:mysql-connector-j</text>
      <text x="14" y="52" fill="#92400E">所有业务模块</text>
    </g>

    <g transform="translate(60, 308)">
      <rect width="220" height="42" rx="8" fill="white" stroke="#B45309" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="14" y="20" font-weight="700" fill="#78350F">H2（mock profile 运行时）</text>
      <text x="14" y="34" fill="#92400E">本地无 MySQL 时内存替代</text>
    </g>
    <g transform="translate(294, 308)">
      <rect width="220" height="42" rx="8" fill="white" stroke="#B45309" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="14" y="20" font-weight="700" fill="#78350F">PostgreSQL JDBC</text>
      <text x="14" y="34" fill="#92400E">pgvector 健康检查（仅 app）</text>
    </g>
    <g transform="translate(528, 308)">
      <rect width="220" height="42" rx="8" fill="white" stroke="#B45309" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="14" y="20" font-weight="700" fill="#78350F">Lombok 1.18.30</text>
      <text x="14" y="34" fill="#92400E">annotation processor（provided）</text>
    </g>
  </g>

  <!-- Lines from Java deps to app -->
  <g stroke="#B45309" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah)">
    <line x1="170" y1="214" x2="510" y2="450"/>
