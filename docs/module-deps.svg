<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="grad-common" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EDE9FE"/><stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="grad-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/><stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="grad-mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CFFAFE"/><stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="grad-high" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/><stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="grad-app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FECACA"/><stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1100" height="720" fill="url(#bg)"/>
  <text x="550" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Hify 内部模块依赖图</text>
  <text x="550" y="52" text-anchor="middle" font-size="12" fill="#64748B">基于 pom.xml 实际依赖 · 仅 com.hify 模块 · 检测无循环</text>

  <!-- Layer band labels (left side) -->
  <g fill="#64748B" font-size="11" font-weight="600">
    <text x="40" y="130">L1 基础设施</text>
    <text x="40" y="280">L2 基础服务</text>
    <text x="40" y="430">L3 复合层</text>
    <text x="40" y="580">L4 业务编排</text>
    <text x="40" y="660">L5 启动入口</text>
  </g>

  <!-- Layer 1: common -->
  <g filter="url(#sh)">
    <rect x="430" y="105" width="220" height="60" rx="10" fill="url(#grad-common)" stroke="#6D28D9" stroke-width="1.5"/>
    <text x="540" y="132" text-anchor="middle" font-weight="700" fill="#3B0764">hify-common</text>
    <text x="540" y="150" text-anchor="middle" font-size="11" fill="#4C1D95">公共基类 / 异常 / 常量</text>
  </g>

  <!-- Layer 2: provider, mcp, knowledge -->
  <g filter="url(#sh)">
    <rect x="120" y="245" width="180" height="60" rx="10" fill="url(#grad-leaf)" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="210" y="272" text-anchor="middle" font-weight="700" fill="#1E3A8A">hify-provider</text>
    <text x="210" y="290" text-anchor="middle" font-size="11" fill="#1E40AF">模型提供商适配</text>
  </g>
  <g filter="url(#sh)">
    <rect x="450" y="245" width="180" height="60" rx="10" fill="url(#grad-leaf)" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="540" y="272" text-anchor="middle" font-weight="700" fill="#1E3A8A">hify-mcp</text>
    <text x="540" y="290" text-anchor="middle" font-size="11" fill="#1E40AF">MCP 工具调用网关</text>
  </g>
  <g filter="url(#sh)">
    <rect x="780" y="245" width="180" height="60" rx="10" fill="url(#grad-leaf)" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="870" y="272" text-anchor="middle" font-weight="700" fill="#1E3A8A">hify-knowledge</text>
    <text x="870" y="290" text-anchor="middle" font-size="11" fill="#1E40AF">RAG 知识库</text>
  </g>

  <!-- Layer 3: agent, workflow -->
  <g filter="url(#sh)">
    <rect x="230" y="395" width="200" height="60" rx="10" fill="url(#grad-mid)" stroke="#0E7490" stroke-width="1.5"/>
    <text x="330" y="422" text-anchor="middle" font-weight="700" fill="#083344">hify-agent</text>
    <text x="330" y="440" text-anchor="middle" font-size="11" fill="#155E75">Agent 配置 · 绑模型/工具</text>
  </g>
  <g filter="url(#sh)">
    <rect x="650" y="395" width="200" height="60" rx="10" fill="url(#grad-mid)" stroke="#0E7490" stroke-width="1.5"/>
    <text x="750" y="422" text-anchor="middle" font-weight="700" fill="#083344">hify-workflow</text>
    <text x="750" y="440" text-anchor="middle" font-size="11" fill="#155E75">工作流编排执行</text>
  </g>

  <!-- Layer 4: chat -->
  <g filter="url(#sh)">
    <rect x="420" y="545" width="240" height="60" rx="10" fill="url(#grad-high)" stroke="#B45309" stroke-width="1.5"/>
    <text x="540" y="572" text-anchor="middle" font-weight="700" fill="#78350F">hify-chat</text>
    <text x="540" y="590" text-anchor="middle" font-size="11" fill="#92400E">对话引擎 · 流式响应</text>
  </g>

  <!-- Layer 5: app -->
  <g filter="url(#sh)">
    <rect x="420" y="625" width="240" height="50" rx="10" fill="url(#grad-app)" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="540" y="650" text-anchor="middle" font-weight="700" fill="#7F1D1D">hify-app</text>
    <text x="540" y="666" text-anchor="middle" font-size="11" fill="#991B1B">Spring Boot 启动入口</text>
  </g>

  <!-- ============ Edges (from dep to dependency) ============ -->
  <!-- L2 -> common -->
  <line x1="210" y1="245" x2="490" y2="165" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="540" y1="245" x2="540" y2="165" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="870" y1="245" x2="590" y2="165" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- L3 -> L2 -->
  <line x1="275" y1="395" x2="210" y2="305" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="385" y1="395" x2="540" y2="305" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="700" y1="395" x2="210" y2="305" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="800" y1="395" x2="870" y2="305" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- L4 -> L3/L2 -->
  <line x1="460" y1="545" x2="330" y2="455" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="500" y1="545" x2="210" y2="305" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="560" y1="545" x2="750" y2="455" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="600" y1="545" x2="870" y2="305" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="540" y1="545" x2="540" y2="305" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- L5 app -> all other modules (聚合依赖) -->
  <line x1="450" y1="625" x2="210" y2="305" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <line x1="490" y1="625" x2="540" y2="305" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <line x1="540" y1="625" x2="870" y2="305" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <line x1="500" y1="625" x2="330" y2="455" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <line x1="580" y1="625" x2="750" y2="455" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <line x1="540" y1="625" x2="540" y2="605" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- Legend -->
  <g transform="translate(960, 380)">
    <rect x="0" y="0" width="130" height="290" rx="10" fill="white" stroke="#94A3B8" opacity="0.95"/>
    <text x="14" y="22" font-weight="700" fill="#0F172A">图例</text>

    <g transform="translate(14,38)">
      <rect width="22" height="14" rx="3" fill="url(#grad-common)" stroke="#6D28D9"/>
      <text x="32" y="13" font-size="11" fill="#334155">L1 · common</text>
    </g>
    <g transform="translate(14,60)">
      <rect width="22" height="14" rx="3" fill="url(#grad-leaf)" stroke="#1D4ED8"/>
      <text x="32" y="13" font-size="11" fill="#334155">L2 · 基础服务</text>
    </g>
    <g transform="translate(14,82)">
      <rect width="22" height="14" rx="3" fill="url(#grad-mid)" stroke="#0E7490"/>
      <text x="32" y="13" font-size="11" fill="#334155">L3 · 复合层</text>
    </g>
    <g transform="translate(14,104)">
      <rect width="22" height="14" rx="3" fill="url(#grad-high)" stroke="#B45309"/>
      <text x="32" y="13" font-size="11" fill="#334155">L4 · 业务编排</text>
    </g>
    <g transform="translate(14,126)">
      <rect width="22" height="14" rx="3" fill="url(#grad-app)" stroke="#B91C1C"/>
      <text x="32" y="13" font-size="11" fill="#334155">L5 · 启动入口</text>
    </g>

    <line x1="14" y1="160" x2="38" y2="160" stroke="#475569" stroke-width="1.4" marker-end="url(#ah)"/>
    <text x="48" y="164" font-size="11" fill="#334155">依赖方向</text>

    <line x1="14" y1="182" x2="38" y2="182" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
    <text x="48" y="186" font-size="11" fill="#334155">app 聚合依赖</text>

    <g transform="translate(14,210)">
      <line x1="0" y1="8" x2="24" y2="8" stroke="#DC2626" stroke-width="2" marker-end="url(#ah-red)"/>
      <text x="32" y="12" font-size="11" fill="#334155">循环依赖</text>
    </g>

    <text x="14" y="252" font-size="11" fill="#16A34A" font-weight="600">✓ 无循环</text>
    <text x="14" y="270" font-size="11" fill="#64748B">7 处内部依赖</text>
  </g>

  <!-- Stats footer -->
  <g transform="translate(40, 670)">
    <text x="0" y="0" font-size="11" fill="#64748B">依赖计数：provider=1 · mcp=1 · knowledge=1 · agent=3 · workflow=3 · chat=6 · app=7</text>
  </g>
</svg>